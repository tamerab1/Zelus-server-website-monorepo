[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in an argument
    # default (`db: Session = Depends(get_db)`) — that's the framework's own
    # documented pattern, not the general Python anti-pattern this rule
    # exists to catch. Every FastAPI project needs this ignored.
    "B008",

    # --- Pre-existing debt, not touched here (see beta-deploy commit that
    # added this file) — CI's `ruff check .` had never actually run clean
    # once against this codebase before, since B008 alone would trip on
    # nearly every route. Deferred rather than bulk-rewritten mid-deploy:
    # rewriting exception handling in the Stripe/PayPal checkout/webhook
    # code without dedicated test coverage around those paths is a good way
    # to introduce a real payment bug chasing a lint score. Revisit each of
    # these deliberately, with tests, separately from infra work.
    "BLE001", # blind `except Exception` — several are deliberate fail-closed
              # boundaries (e.g. webhook signature verification), some may
              # genuinely warrant narrowing — needs case-by-case review.
    "S110",   # try/except: pass
    "S112",   # try/except: continue
    "DTZ003", # datetime.utcnow() — real modernization item, but changing it
              # touches stored-timestamp comparison behavior; do in one pass.
    "TRY004", # type-check-without-type-error
    "LOG014", # exc_info outside an except handler
]
